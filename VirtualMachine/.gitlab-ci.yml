before_script:
    - curl -fsS https://dlang.org/install.sh | bash -s dmd
    - source ~/dlang/dmd-2.074.1/activate
    - dmd --version
    - dub --version

stages:
    - test
    
dub_test_vm:
    stage: test
    script:
        - dub test

dub_test_assembler:
    stage: test
    script:
        - dub test :assembler